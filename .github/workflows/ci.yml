# Runs the same checks a person runs locally, on every push and pull request.
# A push to main that passes those checks is then published to Cloudflare Pages.
name: CI

on:
  push:
  pull_request:

# Read-only: no job here needs to change the repo.
permissions:
  contents: read

jobs:
  ci:
    # Push and PR runs get different names, so branch protection can require one.
    name: ci (${{ github.event_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the code
        uses: actions/checkout@v7
        with:
          # No later step needs the token, so don't leave it on disk.
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Save the built site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          if-no-files-found: error
          # Long enough to re-run a failed deploy after fixing a setting.
          retention-days: 7

  # Holds the Cloudflare token, so it has no checkout and installs none of the
  # repo's dependencies. It only publishes the files the ci job built. Every
  # action here is pinned to an exact commit, because this job can reach the token.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://pipelines-intro.pages.dev
    # Run one deploy at a time, so quick merges can't finish out of order.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      # v8.0.2
      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: site
          path: dist

      # This site is static. Wrangler packages a _worker.js as server code and
      # can pull local files into it, which could expose the token.
      - name: Refuse server-side code
        run: test ! -e dist/_worker.js

      # v7.1.0. Wrangler needs Node 22 or newer.
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      # Installed before the token is available, so install scripts can't read it.
      # The next step sees this exact version and skips its own install.
      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4.156.0

      # v4.1.3
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.156.0
          command: pages deploy dist --project-name=pipelines-intro --branch=main --commit-hash=${{ github.sha }}
