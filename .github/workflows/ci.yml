# Runs the same checks a person runs locally, on every push and pull request.
# A push to main that passes those checks is then published to Cloudflare Pages.
name: CI

on:
  push:
  pull_request:

# Read-only: no job here needs to change the repo.
permissions:
  contents: read

jobs:
  ci:
    # Push and PR runs get different names, so branch protection can require one.
    name: ci (${{ github.event_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the code
        uses: actions/checkout@v7
        with:
          # No later step needs the token, so don't leave it on disk.
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Save the built site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Holds the Cloudflare token, so it deliberately has no checkout and runs none
  # of the repo's code. It only publishes the files the ci job built.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://pipelines-intro.pages.dev
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      # Wrangler needs Node 22 or newer.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Pinned to an exact commit (v4.1.3) because this step receives the token.
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.156.0
          command: pages deploy dist --project-name=pipelines-intro --branch=main --commit-hash=${{ github.sha }}
